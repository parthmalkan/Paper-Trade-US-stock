name: Paper trader

# Runs itself on GitHub's servers. Your Mac does not need to be on.
# Times are UTC. 14:35 UTC = 10:35am ET, inside the US regular session.
# Runs hourly, Mon-Fri, at :35 past the hour. GitHub cron is best-effort:
# a run can be delayed a few minutes at peak load.
#
# The trader itself decides whether to buy. On most runs the timing score is
# below the gate and it does nothing except record the run.

on:
  schedule:
    - cron: "35 13-20 * * 1-5"   # hourly, 13:35-20:35 UTC, Mon-Fri
  workflow_dispatch:             # manual trigger from the Actions tab

permissions:
  contents: write                # needed to commit the updated account files

concurrency:
  # Never let two runs overlap, and never cancel one that is mid-run.
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the paper trader
        run: python paper_trader.py

      - name: Commit changes only when the trader actually traded
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_account.json paper_trades.csv

          if git diff --staged --quiet; then
            echo "No change on this run - nothing committed."
            exit 0
          fi

          # Only commit when the trade log gained rows: that means a real buy
          # happened. Runs that merely update counters leave no commit behind,
          # so the repo stays quiet on idle hours.
          if git diff --staged --numstat -- paper_trades.csv | grep -qE '^[0-9]+'; then
            git commit -m "Paper trade $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Trade committed."
          else
            git reset -- paper_account.json
            echo "No new trades this run - nothing committed."
          fi

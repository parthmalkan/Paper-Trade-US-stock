name: Paper trader

# Runs itself on GitHub's servers. Your Mac does not need to be on.
# Times are UTC. 21:00 UTC = 5:00pm ET (after the US market close).
# GitHub cron is best-effort: runs can be delayed by several minutes at peak load.

on:
  schedule:
    - cron: "0 21 * * 1-5"      # weekdays, after the US close
  workflow_dispatch:            # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write               # needed to commit the updated account files

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the paper trader
        run: python paper_trader.py

      - name: Commit the updated account files
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_account.json paper_trades.csv || true
          if git diff --staged --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Paper run $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

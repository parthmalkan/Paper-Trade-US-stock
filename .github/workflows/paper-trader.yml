name: Paper trader

# Runs itself on GitHub's servers. Your Mac does not need to be on.
# Times are UTC. Runs hourly, Mon-Fri, through the US session.
# GitHub cron is best-effort: a run can be delayed a few minutes at peak load.
#
# The trader decides whether to buy. On most runs the timing score sits below
# the gate and it does nothing except record the run.

on:
  schedule:
    - cron: "35 13-20 * * 1-5"   # hourly, 13:35-20:35 UTC, Mon-Fri
  workflow_dispatch:             # manual trigger from the Actions tab

permissions:
  contents: write                # needed to commit the updated account files

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the paper trader
        run: python paper_trader.py

      - name: Commit the account files
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"

          # Add each file only if it actually exists, so a missing optional
          # file can never fail the run.
          for f in paper_account_a1.json paper_account_a2.json paper_account_a3.json \
                   paper_trades_a1.csv paper_trades_a2.csv paper_trades_a3.csv \
                   paper_summary.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "not present, skipping: $f"
            fi
          done

          if git diff --staged --quiet; then
            echo "Nothing changed this run."
            exit 0
          fi

          git commit -m "Paper run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
